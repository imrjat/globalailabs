<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikhil EyeSphere</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }
    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-family: sans-serif;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px;
      border-radius: 8px;
    }
    .ui label {
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<div id="container"></div>
<div class="ui">
  <label>Eye Color <input type="color" id="eyeColor" value="#00ffff"></label>
  <label>Flame Mode <input type="checkbox" id="flameMode"></label>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let scene, camera, renderer, controls, clock;
let sphere;
let eyeColor = new THREE.Color('#00ffff');
let flameMode = false;

const container = document.getElementById('container');
const eyeColorPicker = document.getElementById('eyeColor');
const flameToggle = document.getElementById('flameMode');

init();
animate();

function createEyeSphere(radius, particleCount) {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(particleCount * 3);
  const colors = new Float32Array(particleCount * 3);

  for (let i = 0; i < particleCount; i++) {
    const i3 = i * 3;
    const r = radius + (Math.random() - 0.5) * 20;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    positions[i3] = x;
    positions[i3 + 1] = y;
    positions[i3 + 2] = z;

    colors[i3] = eyeColor.r;
    colors[i3 + 1] = eyeColor.g;
    colors[i3 + 2] = eyeColor.b;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 3,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  return new THREE.Points(geometry, material);
}

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 2000);
  camera.position.z = 800;

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  clock = new THREE.Clock();
  sphere = createEyeSphere(300, 30000);
  scene.add(sphere);

  eyeColorPicker.addEventListener('input', (e) => {
    eyeColor.set(e.target.value);
    const colors = sphere.geometry.attributes.color.array;
    for (let i = 0; i < colors.length; i += 3) {
      colors[i] = eyeColor.r;
      colors[i + 1] = eyeColor.g;
      colors[i + 2] = eyeColor.b;
    }
    sphere.geometry.attributes.color.needsUpdate = true;
  });

  flameToggle.addEventListener('change', () => {
    flameMode = flameToggle.checked;
  });

  window.addEventListener('resize', onWindowResize);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  const pos = sphere.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    let i3 = i * 3;
    const dist = Math.sqrt(
      pos.array[i3] ** 2 +
      pos.array[i3 + 1] ** 2 +
      pos.array[i3 + 2] ** 2
    );
    let pulse = Math.sin(t * 2 + dist * 0.02) * (flameMode ? 1.5 : 0.3);
    pos.array[i3] *= 1 + pulse * 0.001;
    pos.array[i3 + 1] *= 1 + pulse * 0.001;
    pos.array[i3 + 2] *= 1 + pulse * 0.001;
  }
  pos.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
</script>
</body>
</html>
